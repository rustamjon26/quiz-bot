services:
  - type: worker
    name: safartrip-lead-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PROMO_CODE
        sync: false
      - key: PROMO_TEXT
        sync: false
      - key: SITE_URL
        sync: false
      - key: CHANNELS
        sync: false
      - key: DB_PATH
        sync: false
      - key: SITE_URL_SAFARTRIP
        sync: false
      - key: SITE_URL_MENDORA
        sync: false
      - key: PROMO_CODE_SAFARTRIP
        sync: false
      - key: PROMO_TEXT_SAFARTRIP
        sync: false
      - key: PROMO_CODE_MENDORA
        sync: false
      - key: PROMO_TEXT_MENDORA
        sync: false
      - key: CHANNELS_SAFARTRIP
        sync: false
      - key: CHANNELS_MENDORA
        sync: false
      - key: CONTACT_SAFARTRIP
        sync: false
      - key: CONTACT_MENDORA
        sync: false
